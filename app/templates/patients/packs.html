{% extends "base.html" %}
{% block title %}Santé - Bonos{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Bonos de sesiones</h1>
            <p id="patient-name" class="text-sm text-gray-500"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="openCreatePackModal()" class="text-sm bg-sante-primary text-white px-4 py-2 rounded hover:bg-sante-primary/90">+ Nuevo bono</button>
            <a id="back-btn" href="#" class="text-sm bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 inline-flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Volver</a>
        </div>
    </div>

    <div class="bg-white border-2 border-sante-primary/40 rounded-lg shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left">Sesiones</th>
                    <th class="px-4 py-2 text-right">Precio</th>
                    <th class="px-4 py-2 text-center">Caducidad</th>
                    <th class="px-4 py-2 text-center">Estado</th>
                    <th class="px-4 py-2 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="packs-body"></tbody>
        </table>
    </div>
</div>

<!-- Modal crear bono -->
<div id="create-pack-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white border-2 border-sante-primary/40 rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Crear bono</h2>
        <form id="create-pack-form" class="space-y-3">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Nº de sesiones</label>
                <input type="number" id="cp-sessions" min="1" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Caducidad</label>
                <input type="date" id="cp-expires" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Importe</label>
                <input type="number" id="cp-amount" step="0.01" min="0" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Tipo de documento</label>
                <select id="cp-doc-type" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm">
                    <option value="RECEIPT">Justificante</option>
                    <option value="INVOICE">Factura</option>
                    <option value="SIMPLIFIED_INVOICE">Factura simplificada</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Método de pago</label>
                <select id="cp-payment" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm">
                    <option value="">Pendiente de pago</option>
                    <option value="CASH">Efectivo</option>
                    <option value="BIZUM">Bizum</option>
                </select>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 bg-sante-primary text-white px-4 py-2 rounded text-sm hover:bg-sante-primary/90">Crear bono</button>
                <button type="button" onclick="document.getElementById('create-pack-modal').classList.add('hidden')" class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal registrar pago bono -->
<div id="pack-pay-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white border-2 border-sante-primary/40 rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Registrar pago</h2>
        <form id="pack-pay-form" class="space-y-3">
            <input type="hidden" id="pp-invoice-id">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Método de pago</label>
                <select id="pp-method" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
                    <option value="CASH">Efectivo</option>
                    <option value="BIZUM">Bizum</option>
                </select>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 bg-sante-primary text-white px-4 py-2 rounded text-sm hover:bg-sante-primary/90">Confirmar pago</button>
                <button type="button" onclick="document.getElementById('pack-pay-modal').classList.add('hidden')" class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal editar bono -->
<div id="edit-pack-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white border-2 border-sante-primary/40 rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Editar bono</h2>
        <form id="edit-pack-form" class="space-y-3">
            <input type="hidden" id="ep-id">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Sesiones</label>
                <input type="number" id="ep-sessions" min="1" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Precio</label>
                <input type="number" id="ep-price" step="0.01" min="0" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Caducidad</label>
                <input type="date" id="ep-expires" class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" required>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 bg-sante-primary text-white px-4 py-2 rounded text-sm hover:bg-sante-primary/90">Guardar</button>
                <button type="button" onclick="document.getElementById('edit-pack-modal').classList.add('hidden')" class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">Cancelar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (!checkAuth()) { window.location.href = '/login'; }
    setupNav();

    const patientId = window.location.pathname.split('/')[2];
    document.getElementById('back-btn').href = `/patients/${patientId}`;

    async function loadPatientName() {
        const res = await authFetch(`/api/patients/${patientId}`);
        const p = await res.json();
        document.getElementById('patient-name').textContent = `${p.first_name} ${p.last_name}`;
    }

    async function loadPacks() {
        const res = await authFetch(`/api/billing/packs/patient/${patientId}`);
        const data = await res.json();
        const tbody = document.getElementById('packs-body');

        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">Sin bonos</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(sp => {
            const pendingIcon = sp.pending_invoice_id
                ? `<span class="text-red-600 ml-1" title="Pago pendiente"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg></span>`
                : '';
            const payBtn = sp.pending_invoice_id
                ? `<button onclick="openPackPayModal(${sp.pending_invoice_id})" class="text-green-600 hover:text-green-800" title="Registrar pago"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></button>`
                : '';
            return `
            <tr class="border-t">
                <td class="px-4 py-3">${sp.used_sessions} / ${sp.total_sessions} usadas</td>
                <td class="px-4 py-3 text-right">${sp.price.toFixed(2)} €</td>
                <td class="px-4 py-3 text-center">${formatDate(sp.expires_at) || 'Sin caducidad'}</td>
                <td class="px-4 py-3 text-center">
                    <span class="px-2 py-0.5 rounded text-xs ${sp.is_cancelled ? 'bg-gray-200 text-gray-600' : sp.expired ? 'bg-red-100 text-red-700' : sp.active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
                        ${sp.is_cancelled ? 'Cancelado' : sp.expired ? 'Caducado' : sp.active ? `${sp.remaining} restantes` : 'Agotado'}
                    </span>${pendingIcon}
                </td>
                <td class="px-4 py-3 text-center space-x-1">
                    ${payBtn}
                    ${!sp.is_cancelled ? `<button onclick="editPack(${sp.id}, ${sp.total_sessions}, ${sp.price}, '${sp.expires_at || ''}')" class="text-sante-primary hover:text-sante-primary/70" title="Editar"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>` : ''}
                    ${!sp.is_cancelled ? `<button onclick="cancelPack(${sp.id})" class="text-red-500 hover:text-red-700" title="Cancelar bono"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>` : ''}
                </td>
            </tr>
        `}).join('');
    }

    function openCreatePackModal() {
        document.getElementById('create-pack-form').reset();
        authFetch('/api/config/settings').then(r => r.json()).then(s => {
            if (s.default_pack_price) document.getElementById('cp-amount').value = s.default_pack_price;
        });
        document.getElementById('create-pack-modal').classList.remove('hidden');
    }

    document.getElementById('create-pack-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const packBody = {
            patient_id: parseInt(patientId),
            total_sessions: parseInt(document.getElementById('cp-sessions').value),
            price: parseFloat(document.getElementById('cp-amount').value),
            expires_at: document.getElementById('cp-expires').value || null,
        };
        const packRes = await authFetch('/api/billing/packs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(packBody),
        });
        if (!packRes.ok) {
            const err = await packRes.json();
            showToast(err.detail || 'Error al crear bono', 'error');
            return;
        }
        const packData = await packRes.json();
        const invoiceBody = {
            patient_id: parseInt(patientId),
            session_pack_id: packData.id,
            doc_type: document.getElementById('cp-doc-type').value,
            amount: parseFloat(document.getElementById('cp-amount').value),
            payment_method: document.getElementById('cp-payment').value || null,
            is_paid: !!document.getElementById('cp-payment').value,
        };
        await authFetch('/api/billing/invoices', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(invoiceBody),
        });
        document.getElementById('create-pack-modal').classList.add('hidden');
        showToast('Bono creado');
        loadPacks();
    });

    function editPack(id, sessions, price, expiresAt) {
        document.getElementById('ep-id').value = id;
        document.getElementById('ep-sessions').value = sessions;
        document.getElementById('ep-price').value = price;
        document.getElementById('ep-expires').value = expiresAt;
        document.getElementById('edit-pack-modal').classList.remove('hidden');
    }

    document.getElementById('edit-pack-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('ep-id').value;
        const body = {
            patient_id: parseInt(patientId),
            total_sessions: parseInt(document.getElementById('ep-sessions').value),
            price: parseFloat(document.getElementById('ep-price').value),
            expires_at: document.getElementById('ep-expires').value || null,
        };
        const res = await authFetch(`/api/billing/packs/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (res.ok) {
            document.getElementById('edit-pack-modal').classList.add('hidden');
            loadPacks();
            showToast('Bono actualizado');
        } else {
            const err = await res.json();
            showToast(err.detail || 'Error al actualizar', 'error');
        }
    });

    function cancelPack(id) {
        showConfirm('Cancelar bono', 'El bono se marcará como cancelado. Las sesiones ya consumidas se mantienen registradas.', async () => {
            const res = await authFetch(`/api/billing/packs/${id}`, { method: 'DELETE' });
            if (res.ok) {
                showToast('Bono cancelado');
                loadPacks();
            } else {
                const err = await res.json();
                showToast(err.detail || 'Error', 'error');
            }
        });
    }

    function openPackPayModal(invoiceId) {
        document.getElementById('pp-invoice-id').value = invoiceId;
        document.getElementById('pack-pay-modal').classList.remove('hidden');
    }

    document.getElementById('pack-pay-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const invoiceId = document.getElementById('pp-invoice-id').value;
        const method = document.getElementById('pp-method').value;
        const res = await authFetch(`/api/billing/invoices/${invoiceId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payment_method: method, is_paid: true }),
        });
        if (res.ok) {
            document.getElementById('pack-pay-modal').classList.add('hidden');
            showToast('Pago registrado');
            loadPacks();
        } else {
            const err = await res.json();
            showToast(err.detail || 'Error al registrar pago', 'error');
        }
    });

    loadPatientName();
    loadPacks();
</script>
{% endblock %}
