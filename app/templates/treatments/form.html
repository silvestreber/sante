{% extends "base.html" %}
{% block title %}Santé - Tratamiento{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 id="form-title" class="text-2xl font-bold text-gray-800 mb-6">Nuevo tratamiento</h1>

    <form id="treatment-form" class="bg-white border-2 border-sante-primary/40 rounded-lg shadow p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
            <input type="text" name="title" required class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" placeholder="Ej: Ejercicios de fortalecimiento lumbar">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción / Ejercicios</label>
            <textarea name="description" rows="12" required class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 text-sm" placeholder="Detalla los ejercicios, series, repeticiones y recomendaciones..."></textarea>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="bg-sante-primary text-white px-6 py-2 rounded text-sm hover:bg-sante-primary/90">Guardar</button>
            <a id="cancel-btn" href="#" class="bg-gray-200 text-gray-700 px-6 py-2 rounded text-sm hover:bg-gray-300">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (!checkAuth()) { window.location.href = '/login'; }
    setupNav();

    const parts = window.location.pathname.split('/');
    const patientId = parts[2];
    const treatmentId = parts[4] !== 'new' ? parts[4] : null;
    const isEdit = !!treatmentId;

    document.getElementById('cancel-btn').href = `/patients/${patientId}/treatments`;

    if (isEdit) {
        document.getElementById('form-title').textContent = 'Editar tratamiento';
        authFetch(`/api/treatments/${treatmentId}`)
            .then(r => r.json())
            .then(t => {
                document.querySelector('[name="title"]').value = t.title;
                document.querySelector('[name="description"]').value = t.description;
            });
    }

    document.getElementById('treatment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            title: e.target.title.value,
            description: e.target.description.value,
        };

        let url, method;
        if (isEdit) {
            url = `/api/treatments/${treatmentId}`;
            method = 'PUT';
        } else {
            url = '/api/treatments';
            method = 'POST';
            body.patient_id = parseInt(patientId);
        }

        const res = await authFetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (res.ok) {
            window.location.href = `/patients/${patientId}/treatments`;
        }
    });
</script>
{% endblock %}
