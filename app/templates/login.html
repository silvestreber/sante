{% extends "base.html" %}
{% block title %}Santé - Iniciar sesión{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white border-2 border-sante-primary/40 p-8 rounded-lg shadow-md w-full max-w-sm">
        <img src="/static/img/logo_azul.png" alt="Clínica Santé" class="h-16 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-sante-primary text-center mb-6">Clínica SANTÉ</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" required
                    class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sante-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full border-2 border-sante-primary/40 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sante-primary">
            </div>
            <button type="submit"
                class="w-full bg-sante-primary text-white py-2 rounded hover:bg-sante-primary/90 transition">
                Entrar
            </button>
            <p id="login-error" class="text-red-600 text-sm text-center hidden"></p>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (localStorage.getItem('token')) { window.location.href = '/calendar'; }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorEl = document.getElementById('login-error');
        errorEl.classList.add('hidden');

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: form.username.value,
                password: form.password.value
            })
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('full_name', data.full_name);
            localStorage.setItem('is_physio', data.is_physio);
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('just_logged_in', '1');
            window.location.href = '/calendar';
        } else {
            errorEl.textContent = 'Usuario o contraseña incorrectos';
            errorEl.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
