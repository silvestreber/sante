{% extends "base.html" %}
{% block title %}Documentación — Santé{% endblock %}

{% block head %}
<style>
    .md-content h1 { font-size: 1.75rem; font-weight: 700; color: #1f2937; margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #0d9488; }
    .md-content h2 { font-size: 1.35rem; font-weight: 600; color: #0d9488; margin: 1.75rem 0 0.75rem; }
    .md-content h3 { font-size: 1.1rem; font-weight: 600; color: #374151; margin: 1.25rem 0 0.5rem; }
    .md-content p { margin: 0.5rem 0; line-height: 1.7; color: #4b5563; }
    .md-content ul { list-style: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .md-content ul ul { list-style: circle; margin: 0.25rem 0; }
    .md-content li { margin: 0.3rem 0; color: #4b5563; line-height: 1.6; }
    .md-content strong { color: #1f2937; }
    .md-content code { background: #f3f4f6; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.85rem; color: #0d9488; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
    .md-content th { background: #f0fdfa; color: #0d9488; font-weight: 600; text-align: left; padding: 0.5rem 0.75rem; border: 1px solid #e5e7eb; }
    .md-content td { padding: 0.5rem 0.75rem; border: 1px solid #e5e7eb; color: #4b5563; }
    .md-content tr:nth-child(even) { background: #f9fafb; }
    .md-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
    .md-content a { color: #0d9488; text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white border-2 border-sante-primary/40 rounded-lg shadow p-8 md-content">
    {{ content | safe }}
</div>

<div class="max-w-4xl mx-auto mt-6 bg-white border-2 border-sante-primary/40 rounded-lg shadow p-6">
    <h2 class="text-lg font-semibold text-gray-800 mb-3">Notas de desarrollo</h2>
    <p class="text-xs text-gray-500 mb-3">Apuntes sobre cosas a mejorar, arreglar o añadir.</p>
    <textarea id="dev-notes" rows="8" class="w-full border-2 border-sante-primary/40 rounded px-4 py-3 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-sante-primary" placeholder="Escribe notas aquí..."></textarea>
    <div class="flex items-center justify-between mt-3">
        <span id="notes-status" class="text-xs text-gray-400"></span>
        <button onclick="saveDevNotes()" class="bg-sante-primary text-white px-5 py-2 rounded text-sm font-medium hover:bg-sante-primary/90">Guardar notas</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (!checkAuth()) { window.location.href = '/login'; }
    setupNav();

    async function loadDevNotes() {
        const res = await authFetch('/api/notes');
        const data = await res.json();
        document.getElementById('dev-notes').value = data.content || '';
    }

    async function saveDevNotes() {
        const content = document.getElementById('dev-notes').value;
        const res = await authFetch('/api/notes', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
        });
        if (res.ok) {
            document.getElementById('notes-status').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
            showToast('Notas guardadas');
        }
    }

    loadDevNotes();
</script>
{% endblock %}
